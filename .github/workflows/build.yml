name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify catalog and build executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Self-test (catalog + taxonomy)
        run: python app.py --selftest

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build one-file executable
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name AAS-Skills-Studio
          --add-data "data/catalog.json;data"
          --add-data "data/groups.json;data"
          --add-data "data/skills.json;data"
          --hidden-import search_engine app.py

      - name: Smoke-test the executable
        run: |
          $p = Start-Process -FilePath ".\dist\AAS-Skills-Studio.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with $($p.ExitCode)" }
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAS-Skills-Studio-windows
          path: dist/AAS-Skills-Studio.exe
          if-no-files-found: error
          retention-days: 14
